# Windows x64 test build only.
# Does not create a release, tag, deployment, or signature.
# Dispatched manually with the full source commit to build.

name: windows-test-build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-test-build-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: test-and-package
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Refuse any other commit
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim().ToLower()
          $want = "${{ inputs.source_sha }}".Trim().ToLower()
          if ($want -notmatch '^[0-9a-f]{40}$') {
            Write-Error "source_sha must be a full 40-character commit id"
            exit 1
          }
          if ($head -ne $want) {
            Write-Error "Checked out $head, refusing to build anything except $want"
            exit 1
          }
          Write-Host "Building $head"

      - name: Set up Python 3.10.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install pyinstaller==6.11.1

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build windowed executable
        run: python -m PyInstaller -Fw --icon=Mondrian.ico --add-data "./assets;assets" --hidden-import PySide6.QtMultimedia KeymouseGo.py

      - name: Pack zip with Chinese instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pack | Out-Null
          Copy-Item dist\KeymouseGo.exe pack\KeymouseGo.exe
          Copy-Item packaging\使用说明.txt pack\使用说明.txt
          $zip = "pack\KeymouseGo-windows-x64-background-test.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Push-Location pack
          Compress-Archive -Path .\KeymouseGo.exe, .\使用说明.txt -DestinationPath .\KeymouseGo-windows-x64-background-test.zip
          Pop-Location
          $exeHash = (Get-FileHash pack\KeymouseGo.exe -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash
          @(
            "KeymouseGo.exe $exeHash"
            "KeymouseGo-windows-x64-background-test.zip $zipHash"
            "source ${(git rev-parse HEAD).Trim()}"
          ) | Set-Content -Encoding ascii pack\SHA256.txt
          Get-Content pack\SHA256.txt
          Get-Item pack\KeymouseGo.exe, $zip | Format-List Name, Length

      - name: Smoke-start the executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path pack\KeymouseGo.exe).Path
          $work = Split-Path $exe
          $env:QT_QPA_PLATFORM = "windows"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) {
            Write-Host "Executable exited early with code $($proc.ExitCode)"
            if (Test-Path "$work\logs") {
              Get-ChildItem "$work\logs" | ForEach-Object { Write-Host "---- $($_.Name) ----"; Get-Content $_.FullName }
            }
            exit 1
          }
          Write-Host "Executable still running after 12 seconds; pid $($proc.Id)"
          Stop-Process -Id $proc.Id -Force
          Get-Process KeymouseGo -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Smoke start passed"

      - name: Upload zip and checksum
        uses: actions/upload-artifact@v4
        with:
          name: KeymouseGo-windows-x64
          path: |
            pack/KeymouseGo-windows-x64-background-test.zip
            pack/SHA256.txt
          if-no-files-found: error
          retention-days: 14
